<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dt3rmind nav — The Climb (concept C)</title>
<style>
  /* ---- Okabe–Ito theme tokens, mirrored from src/styles.css ---- */
  :root {
    --bg: #0d1117; --bg-elev: #161c2b; --card: #1a2130; --border: #2a3444;
    --text: #e8ecf4; --muted: #8a97ab;
    --ok: #009e73; --ok-sub: #0b2a22; --danger: #d55e00; --danger-sub: #2e1a0d;
    --accent: #0072b2; --accent-sub: #0b2238; --sky: #56b4e9; --warn: #e69f00;
    --purple: #cc79a7; --yellow: #f0e442;
    /* two-tone board squares, derived from tokens (not a wood texture) */
    --sq-dark: #1a2334; --sq-light: #222c40;
    --sq-dark-edge: #0f1726; --sq-light-edge: #182135;
  }
  body.light {
    --bg: #f6f7f9; --bg-elev: #fff; --card: #fff; --border: #d5dae2;
    --text: #1d2433; --muted: #5b6578;
    --ok-sub: #e3f4ee; --danger-sub: #fbeadf; --accent-sub: #e2eef7;
    --sq-dark: #dfe5ee; --sq-light: #eef1f6;
    --sq-dark-edge: #cfd6e2; --sq-light-edge: #e2e7f0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  a { color: var(--sky); }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 20px 64px; }

  /* ---- top bar: title, rank/XP, moves deck ---- */
  header.bar {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    justify-content: space-between; margin-bottom: 18px;
  }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .meters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 7px 13px; font-size: 13px;
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 2px; }
  .rank-chip { border-color: var(--accent); }
  .rank-chip b { color: var(--sky); }
  .xpbar { width: 120px; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .xpbar > i { display: block; height: 100%; width: 48%; background: var(--accent); }
  .toggle {
    cursor: pointer; background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 13px;
  }
  .toggle:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 14px;
    color: var(--muted); font-size: 12.5px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { flex: none; }

  /* ---- the board ---- */
  .board-shell {
    position: relative; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 16px; padding: 10px;
    overflow: hidden;
  }
  .board-svg { display: block; width: 100%; height: auto; }

  /* HTML tile buttons layered over the SVG board (positioned by %), desktop */
  .tiles { position: absolute; inset: 10px; margin: 0; padding: 0; list-style: none; }
  .tile-li { position: absolute; transform: translate(-50%, -50%); }

  .tile {
    appearance: none; cursor: pointer; font: inherit; color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    width: 104px; padding: 8px 7px 9px; text-align: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.28);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  body.light .tile { box-shadow: 0 4px 10px rgba(20,30,50,.12); }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,.34); }
  .tile:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .tile .idx {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 7px;
    font-weight: 700; font-size: 14px; letter-spacing: .3px;
    background: var(--bg-elev); border: 1px solid var(--border);
  }
  .tile .ti { font-size: 12px; line-height: 1.25; color: var(--text); }
  .tile .meta { font-size: 11px; color: var(--muted); }
  .tile .stars { font-size: 12px; letter-spacing: 1px; color: var(--yellow); }
  .tile .stars .off { color: var(--border); }

  /* states — shape + color + icon, never color alone */
  .tile[data-state="locked"] { opacity: .62; }
  .tile[data-state="locked"] .idx { background: transparent; }
  .tile[data-state="current"] { border-color: var(--sky); box-shadow: 0 0 0 2px var(--sky), 0 10px 22px rgba(0,0,0,.4); }
  .tile[data-state="current"] .idx { background: var(--accent-sub); border-color: var(--accent); color: var(--sky); }
  .tile[data-state="passed"] .idx { background: var(--ok-sub); border-color: var(--ok); color: var(--ok); }
  .tile.boss { width: 128px; border-color: var(--purple); background: linear-gradient(180deg, var(--card), color-mix(in srgb, var(--purple) 12%, var(--card))); }
  .tile.boss .idx { border-color: var(--purple); color: var(--purple); }
  .tile.keystone { border-color: var(--warn); }
  .tile.keystone .idx { border-color: var(--warn); color: var(--warn); }
  .tile.capstone { width: 150px; border-color: var(--yellow); background: linear-gradient(180deg, var(--card), color-mix(in srgb, var(--yellow) 14%, var(--card))); }
  .tile.capstone .idx { border-color: var(--yellow); color: var(--warn); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted);
  }
  .badge svg { flex: none; }

  /* "you are here" flag */
  .youhere {
    position: absolute; transform: translate(-50%, -140%);
    background: var(--sky); color: #04121d; font-weight: 700; font-size: 11px;
    padding: 3px 9px; border-radius: 8px; white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .youhere::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--sky);
  }

  /* promotion milestone labels (rank bands) */
  .promo {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-elev); border: 1px dashed var(--accent);
    color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); max-width: 190px;
  }
  .promo b { color: var(--sky); }
  .promo svg { flex: none; }

  /* seam marker (river / rank-line) */
  .seam-label {
    position: absolute; transform: translate(-50%, -50%); rotate: -26.57deg;
    color: var(--sky); font-size: 12px; font-weight: 700; letter-spacing: .4px;
    text-shadow: 0 1px 3px rgba(0,0,0,.5); pointer-events: none; white-space: nowrap;
  }
  body.light .seam-label { text-shadow: none; }

  .afterboard { margin-top: 14px; color: var(--muted); font-size: 13px; }

  /* ---- mobile: single column, board hidden, path becomes a vertical ladder ---- */
  .mobile-list { display: none; }
  @media (max-width: 720px) {
    .board-shell { display: none; }
    .legend { font-size: 12px; }
    .mobile-list { display: block; }
    .mlist { list-style: none; margin: 0; padding: 0; position: relative; }
    .mlist::before {
      content: ""; position: absolute; left: 27px; top: 10px; bottom: 10px;
      width: 3px; background: var(--border); border-radius: 2px;
    }
    .mrow { position: relative; padding: 8px 0 8px 60px; }
    .mrow .tile { flex-direction: row; width: 100%; gap: 10px; text-align: left; align-items: center; }
    .mrow .tile .ti { flex: 1; }
    .mrow .tile .idx { position: absolute; left: 12px; z-index: 1; }
    .mband {
      margin: 16px 0 4px; padding-left: 8px; font-size: 12px; font-weight: 700;
      color: var(--sky); text-transform: uppercase; letter-spacing: .5px;
      border-left: 3px solid var(--accent); 
    }
    .mseam {
      margin: 14px 0; padding: 10px 12px; border: 1px dashed var(--sky);
      border-radius: 10px; color: var(--text); font-size: 13px; background: var(--accent-sub);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile:hover { transform: none; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">
      <h1>Dt3rmind — The Climb</h1>
      <p>Promote your piece up the board. Concept C.</p>
    </div>
    <div class="meters">
      <span class="chip rank-chip" title="Current rank">
        <!-- knight glyph: you are rank Shaper -->
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5 14h7v-1.4H5V14zm.6-2.4h6.1c.2-2.2-.3-4.1-1.7-5.6l.9-1.3-1-1.6-1.3 1C7.2 3.4 6 3.3 5 3.8 4 4.3 3.4 5.3 3.4 6.4l1.5.5c.1-.6.4-1 .9-1.2l.5.9-2 2.6c-.6.8-.8 1.6-.6 2.4h1.9z"/></svg>
        Rank: <b>Shaper</b>
      </span>
      <span class="chip" title="Experience toward next rank">
        XP <span class="xpbar" aria-hidden="true"><i></i></span>
        <span class="sr-only">48 percent to Tool User</span>
      </span>
      <span class="chip" title="Moves unlocked">Moves M1–M4</span>
      <button class="toggle" id="themeBtn" type="button" aria-pressed="false">Light theme</button>
    </div>
  </header>

  <div class="legend" aria-hidden="false">
    <span><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="var(--ok-sub)" stroke="var(--ok)"/><path d="M5 8l2 2 4-4" fill="none" stroke="var(--ok)" stroke-width="1.6"/></svg> Passed (with stars)</span>
    <span><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="var(--accent-sub)" stroke="var(--sky)"/><circle cx="8" cy="8" r="2.3" fill="var(--sky)"/></svg> Current (you are here)</span>
    <span><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="var(--border)"/><path d="M6 7V5.5a2 2 0 0 1 4 0V7m-5 0h6v4H5z" fill="none" stroke="var(--muted)" stroke-width="1.2"/></svg> Locked</span>
    <span><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="var(--purple)"/><path d="M4 11h8l-1-5-2 2-1-3-1 3-2-2z" fill="var(--purple)"/></svg> Boss (promotion guard)</span>
    <span><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="var(--warn)"/><path d="M8 3l1.6 3.2 3.4.5-2.5 2.4.6 3.5L8 11.4 4.9 12.6l.6-3.5L3 6.7l3.4-.5z" fill="var(--warn)"/></svg> Keystone</span>
    <span><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="var(--yellow)"/><path d="M4 12h8V5l-2 1.5L8 3 6 6.5 4 5z" fill="var(--yellow)"/></svg> Capstone</span>
  </div>

  <!-- ============ DESKTOP: isometric board + layered path ============ -->
  <div class="board-shell">
    <!-- Two-tone isometric board drawn as flat SVG (no wood texture). 8 bands bottom-left -> top-right.
         viewBox is 1000 wide; height set so a diagonal climb fits. -->
    <svg class="board-svg" viewBox="0 0 1200 1260" role="img"
         aria-label="An isometric two-tone chessboard. A numbered path of levels climbs diagonally from the bottom-left square to the top-right square, one world per band, with a rank milestone at the end of each band.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10z" fill="var(--sky)"/>
        </marker>
      </defs>

      <!-- board squares: 7 columns x 7 rows of parallelogram squares (isometric skew).
           Generated statically. Dark/light alternate like a chessboard. -->
      <g id="squares"></g>

      <!-- Workshop seam: a rank-line "river" cutting across the board between W4 and W5 -->
      <polyline id="seamLine" points="" fill="none" stroke="var(--sky)" stroke-width="4"
                stroke-dasharray="2 10" stroke-linecap="round" opacity=".9"/>

      <!-- the climbing path connector -->
      <polyline id="pathLine" points="" fill="none" stroke="var(--sky)" stroke-width="3"
                stroke-dasharray="6 8" stroke-linecap="round" marker-end="url(#arrow)" opacity=".8"/>

      <!-- decorative chess pieces as flat two-tone SVG at band milestones -->
      <g id="pieces"></g>
    </svg>

    <!-- the real, ordered, keyboard-navigable list of level tiles, absolutely positioned over the board -->
    <ol class="tiles" id="tiles" aria-label="Level path, in order"></ol>

    <!-- rank promotion milestones + seam label + you-are-here flag injected here -->
    <div id="overlays"></div>
  </div>

  <!-- ============ MOBILE: single-column ordered ladder (same DOM data) ============ -->
  <div class="mobile-list">
    <ol class="mlist" id="mlist" aria-label="Level path, in order"></ol>
  </div>

  <p class="afterboard" id="afterboard"></p>
</div>

<script>
/* -------- the real 31 packets, in order, with a sample progress state -------- */
/* state: W1 fully done, W2 half done (current = w2-l3), rest locked */
const WORLDS = [
  { world:1, theme:'Shape the Answer',        rank:'Shaper',    piece:'knight' },
  { world:2, theme:'Spot the Guess',          rank:null,        piece:null     },
  { world:3, theme:'Answer from the Source',  rank:'Tool User', piece:'bishop' },
  { world:4, theme:'Name the Check',          rank:'Checker',   piece:'rook'   }, // keystone world
  { world:5, theme:'Have AI Build the Tool',  rank:null,        piece:null     },
  { world:6, theme:'Prove It & Fix It',       rank:'Builder',   piece:'queen'  },
  { world:7, theme:'Decide Where It Matters', rank:'Architect', piece:'king'   },
];
const RANK_ORDER = ['Guesser','Shaper','Tool User','Checker','Builder','Architect'];

// id, world, order, title, kind, maxStars, state, stars(earned)
const L = (id,w,o,t,kind,maxStars,state,stars)=>({id,w,o,t,kind,maxStars,state,stars});
const PACKETS = [
  // World 1 — done
  L('w1-l1',1,1,'The receipt','level',2,'passed',2),
  L('w1-l2',1,2,'One shape, many orders','level',3,'passed',3),
  L('w1-l3',1,3,'The field that must be there','level',3,'passed',2),
  L('w1-boss',1,4,'Boss: shape a help-desk ticket','boss',3,'passed',3),
  // World 2 — half done
  L('w2-l1',2,1,'Why it guesses','level',3,'passed',3),
  L('w2-l2',2,2,'Highlight the guess','level',2,'passed',2),
  L('w2-l3',2,3,'Ask for the tool, not the answer','level',3,'current',0),
  L('w2-l4',2,4,'Right-answer or open?','level',3,'unlocked',0),
  L('w2-boss',2,5,"Boss: triage the clinic's monthly note",'boss',3,'locked',0),
  // World 3 — locked
  L('w3-l1',3,1,'Only from the sheet','level',3,'locked',0),
  L('w3-l2',3,2,"When the answer isn't there",'level',3,'locked',0),
  L('w3-l3',3,3,"Cite it or it didn't happen",'level',3,'locked',0),
  L('w3-boss',3,4,"The zone that isn't on the table",'boss',3,'locked',0),
  // World 4 — keystone world
  L('w4-l1',4,1,'Can this check even fail?','level',3,'locked',0),
  L('w4-l2',4,2,'Which check is stronger?','level',3,'locked',0),
  L('w4-l3',4,3,'Fix the check that lets a bad one through','level',3,'locked',0),
  L('w4-l4',4,4,'Ask for the check first','keystone',3,'locked',0),
  L('w4-boss',4,5,'The refund promise with no ticket','boss',3,'locked',0),
  // Workshop seam after W4 (gate), then World 5
  L('w5-l1',5,1,'Describe the tool','level',3,'locked',0),
  L('w5-l2',5,2,'Prove it on more than one month','level',3,'locked',0),
  L('w5-l3',5,3,"The check you can't peek past",'level',3,'locked',0),
  L('w5-boss',5,4,'Build it and prove it: average order value by weekday','boss',3,'locked',0),
  // World 6
  L('w6-l1',6,1,'The green that lied','level',3,'locked',0),
  L('w6-l2',6,2,'Point at the broken case','level',3,'locked',0),
  L('w6-l3',6,3,'Prove it like you mean it','level',3,'locked',0),
  L('w6-boss',6,4,'The timezone that dropped the orders','boss',3,'locked',0),
  // World 7
  L('w7-l1',7,1,'What does it cost to be wrong?','level',3,'locked',0),
  L('w7-l2',7,2,'The gate that was too expensive','level',3,'locked',0),
  L('w7-l3',7,3,'Your call, defended','level',3,'locked',0),
  L('w7-boss',7,4,'The loan-approval assistant','boss',3,'locked',0),
  // Capstone (far corner)
  L('capstone',7,5,'Capstone: the volunteer-shift scheduler','capstone',3,'locked',0),
];
const SEAM_AFTER_WORLD = 4;
const SEAM_TEXT = "Workshop seam — now the AI builds real tools you keep";

/* ---------------- board geometry: a diagonal climb ----------------
   We lay the 31 tiles out as a snake across an isometric board, climbing
   bottom-left (0,0 in board space) to top-right. Each WORLD is a horizontal
   band of columns; the snake alternates L->R / R->L per band so it reads as a
   single continuous path. Promotion milestone sits at the end of each band. */

const COLS = 6;                      // columns the snake uses across each band
const BANDS = WORLDS.length;         // 7 worlds = 7 bands
const VB_W = 1200, VB_H = 1260;      // tall canvas so all 7 bands + capstone fit
const SKEW = 0.42;                    // isometric vertical skew of each square
const originX = 110, originY = 1150;  // bottom-left square center in viewBox units
const colStep = 158;                  // horizontal spacing between columns
const bandStep = 168;                 // vertical rise per band (world)
const bandDrift = 6;                  // each band drifts right as it rises (BL->TR climb)

// map a (band, colIndex-left-to-right) to an isometric point in the viewBox
function iso(band, col){
  const x = originX + col*colStep + band*bandDrift;
  const y = originY - band*bandStep - col*(colStep*SKEW*0.08);
  return {x, y};
}

/* Each world's tiles occupy its band. Build the ordered list of {packet, band, col}
   so the snake alternates direction per band. Within a band tiles are evenly spread. */
function layout(){
  const byWorld = {};
  PACKETS.forEach(p => (byWorld[p.w] ||= []).push(p));
  const placed = [];
  WORLDS.forEach((W, bi) => {
    const list = byWorld[W.world];
    const n = list.length;
    // spread n tiles across COLS columns of the band
    list.forEach((p, i) => {
      const frac = n === 1 ? 0.5 : i/(n-1);
      let col = frac*(COLS-1);
      // snake: odd bands run right-to-left
      if (bi % 2 === 1) col = (COLS-1) - col;
      placed.push({ p, band: bi, col });
    });
  });
  return placed;
}

/* -------- render the board squares (two-tone, flat) -------- */
function squarePath(cx, cy){
  const w = colStep*0.86, h = colStep*0.86;
  const sx = w/2, sy = (h/2)*SKEW; // isometric diamond
  return `M${cx} ${cy-sy} L${cx+sx} ${cy} L${cx} ${cy+sy} L${cx-sx} ${cy} Z`;
}
function renderSquares(){
  const g = document.getElementById('squares');
  let html = '';
  for (let b=0; b<BANDS; b++){
    for (let c=0; c<COLS; c++){
      const {x,y} = iso(b, c);
      const dark = (b + c) % 2 === 0;
      const fill = dark ? 'var(--sq-dark)' : 'var(--sq-light)';
      const edge = dark ? 'var(--sq-dark-edge)' : 'var(--sq-light-edge)';
      html += `<path d="${squarePath(x,y)}" fill="${fill}" stroke="${edge}" stroke-width="1"/>`;
    }
  }
  g.innerHTML = html;
}

/* -------- flat two-tone chess piece glyphs (decoration) -------- */
const PIECE_SVG = {
  knight:'<path d="M-7 20h18v-3H-7v3zm1.5-4h15c.5-5-.6-9.4-3.8-12.2l1.8-2.6-2.1-3.1-2.6 2C.3-5 -1.6-5 -3.6-4.4c-2 .6-3.4 2.6-3.4 4.8l3 .9c.2-1 .7-1.8 1.6-2.1l1 1.6-4 5c-1.2 1.5-1.5 3-.9 4.2z"/>',
  bishop:'<path d="M-7 20h14v-3H-7v3zM0-13c-2 2-5 5-5 9 0 3 2 5 5 6 3-1 5-3 5-6 0-4-3-7-5-9zm0 4a1.4 1.4 0 1 1 0 2.8A1.4 1.4 0 0 1 0-9z"/>',
  rook:'<path d="M-8 20h16v-3H-8v3zm1-5h14V3H-7v12zM-7 0h2v-4h-2v4zm4 0h2v-4h-2v4zm4 0h2v-4h-2v4zm4 0h2v-4h-2v4z"/>',
  queen:'<path d="M-9 20h18v-3H-9v3zm1-5h16L15-1l-5 4-2-8-3 7-3-7-2 8-5-4z"/><circle cx="0" cy="-5" r="2"/>',
  king:'<path d="M-9 20h18v-3H-9v3zm1-5h16V2H-8v13zM-2-3h4v-3h3v-3h-3v-3h-4v3h-3v3h3z"/>',
};
function renderPieces(placed){
  const g = document.getElementById('pieces');
  let html = '';
  WORLDS.forEach((W, bi) => {
    if (!W.piece) return;
    // put the promoted piece at the band's milestone (last tile of band)
    const bandTiles = placed.filter(x => x.band === bi);
    const last = bandTiles[bandTiles.length-1];
    const {x,y} = iso(last.band, last.col);
    const col = (bi % 2 === 0) ? 'var(--sq-dark-edge)' : 'var(--sq-light-edge)';
    const accent = 'var(--muted)';
    html += `<g transform="translate(${x+62} ${y-6}) scale(1.5)" fill="${col}" stroke="${accent}" stroke-width="0.5" opacity=".9" aria-hidden="true">${PIECE_SVG[W.piece]}</g>`;
  });
  // a decorative starting pawn at the very first square
  const first = placed[0];
  const f = iso(first.band, first.col);
  g.innerHTML = html + `<g transform="translate(${f.x-62} ${f.y+2}) scale(1.4)" fill="var(--sq-dark-edge)" stroke="var(--muted)" stroke-width="0.5" opacity=".9" aria-hidden="true"><path d="M-6 20h12v-3H-6v3zm1-4h10c.3-4-1-7-3-8a3 3 0 1 0-4 0c-2 1-3.3 4-3 8z"/></g>`;
}

/* -------- render path connector + tiles + overlays -------- */
function starStr(earned, max){
  let s='';
  for (let i=0;i<max;i++) s += (i<earned) ? '★' : '<span class="off">☆</span>';
  return s;
}
const KIND_BADGE = {
  boss:'<span class="badge"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M4 12h8l-1-5-2 2-1-3-1 3-2-2z" fill="var(--purple)"/></svg>Boss</span>',
  keystone:'<span class="badge"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M8 2l1.8 3.6 4 .6-2.9 2.8.7 4L8 11.6 4.4 13l.7-4L2.2 6.2l4-.6z" fill="var(--warn)"/></svg>Keystone</span>',
  capstone:'<span class="badge"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M3 13h10V4l-2.5 2L8 2 5.5 6 3 4z" fill="var(--yellow)"/></svg>Capstone · king</span>',
};
function renderPathAndTiles(placed){
  // percentage positions (relative to .tiles box = board viewBox) for HTML tiles
  const pct = placed.map(({p,band,col}) => {
    const {x,y} = iso(band,col);
    return { p, xp:(x/VB_W*100), yp:(y/VB_H*100) };
  });

  // SVG connector through all centers
  document.getElementById('pathLine')
    .setAttribute('points', placed.map(({band,col})=>{const {x,y}=iso(band,col);return `${x},${y}`;}).join(' '));

  // Workshop seam line: a rank-line river between band 3 (W4) and band 4 (W5)
  const yA = (iso(SEAM_AFTER_WORLD-1, 0).y + iso(SEAM_AFTER_WORLD, 0).y)/2;
  const yB = (iso(SEAM_AFTER_WORLD-1, COLS-1).y + iso(SEAM_AFTER_WORLD, COLS-1).y)/2;
  const xA = iso(SEAM_AFTER_WORLD, 0).x - 40, xB = iso(SEAM_AFTER_WORLD, COLS-1).x + 40;
  document.getElementById('seamLine').setAttribute('points', `${xA},${yA} ${xB},${yB}`);

  // tiles (ordered list)
  const ol = document.getElementById('tiles');
  let num = 0;
  ol.innerHTML = pct.map(({p,xp,yp}) => {
    num++;
    const cls = ['tile', p.kind==='boss'?'boss':'', p.kind==='keystone'?'keystone':'', p.kind==='capstone'?'capstone':''].filter(Boolean).join(' ');
    const W = WORLDS[p.w-1];
    const stateWord = {locked:'Locked',unlocked:'Not started',current:'You are here, in progress',passed:'Passed'}[p.state];
    const starsSr = p.state==='passed' ? `, ${p.stars} of ${p.maxStars} stars` : '';
    const srLabel = `World ${p.w}, ${W.theme}, step ${p.o}. ${p.t}. ${p.kind!=='level'?p.kind+'. ':''}${stateWord}${starsSr}.`;
    const kindBadge = KIND_BADGE[p.kind] || '';
    const starsRow = p.state==='passed'
      ? `<span class="stars" aria-hidden="true">${starStr(p.stars,p.maxStars)}</span>`
      : (p.state==='locked' ? `<span class="meta">Locked</span>` : (p.state==='current'?`<span class="meta">In progress</span>`:`<span class="meta">Ready</span>`));
    const disabled = p.state==='locked' ? 'aria-disabled="true"' : '';
    return `<li class="tile-li" style="left:${xp}%;top:${yp}%">
      <button class="${cls}" data-state="${p.state}" ${disabled} aria-current="${p.state==='current'?'step':'false'}">
        <span class="sr-only">${srLabel}</span>
        <span class="idx" aria-hidden="true">${num}</span>
        ${kindBadge}
        <span class="ti" aria-hidden="true">${p.t}</span>
        ${starsRow}
      </button>
    </li>`;
  }).join('');

  // overlays: you-are-here flag + promotion milestones + seam label
  const ov = document.getElementById('overlays');
  let oh = '';
  const cur = pct.find(x => x.p.state==='current');
  if (cur) oh += `<div class="youhere" style="left:${cur.xp}%;top:${cur.yp}%">You are here</div>`;

  WORLDS.forEach((W, bi) => {
    if (!W.rank) return;
    const bandTiles = placed.filter(x=>x.band===bi);
    const last = bandTiles[bandTiles.length-1];
    const {x,y} = iso(last.band,last.col);
    const prevRank = RANK_ORDER[RANK_ORDER.indexOf(W.rank)-1] || 'Guesser';
    oh += `<div class="promo" style="left:${(x/VB_W*100)}%;top:${((y-70)/VB_H*100)}%">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5 3v3c0 3-2 5-5 6-3-1-5-3-5-6V5z" fill="none" stroke="var(--accent)" stroke-width="1.3"/><path d="M8 5v5M6 8h4" stroke="var(--sky)" stroke-width="1.3"/></svg>
      Promotion square — <b>${prevRank} → ${W.rank}</b>
    </div>`;
  });

  // seam label along the river
  const sx = (xA+xB)/2, sy = (yA+yB)/2;
  oh += `<div class="seam-label" style="left:${(sx/VB_W*100)}%;top:${(sy/VB_H*100)}%">${SEAM_TEXT}</div>`;
  ov.innerHTML = oh;
}

/* -------- mobile ladder (same ordered data) -------- */
function renderMobile(){
  const ol = document.getElementById('mlist');
  let num = 0, html = '', lastWorld = 0;
  PACKETS.forEach(p => {
    num++;
    const W = WORLDS[p.w-1];
    if (p.w !== lastWorld){
      lastWorld = p.w;
      html += `<li class="mband" aria-hidden="true">World ${p.w} · ${W.theme}${W.rank?` · promotes to ${W.rank}`:''}</li>`;
    }
    const stateWord = {locked:'Locked',unlocked:'Not started',current:'You are here, in progress',passed:'Passed'}[p.state];
    const starsSr = p.state==='passed' ? `, ${p.stars} of ${p.maxStars} stars` : '';
    const srLabel = `World ${p.w}, ${W.theme}, step ${p.o}. ${p.t}. ${p.kind!=='level'?p.kind+'. ':''}${stateWord}${starsSr}.`;
    const cls = ['tile', p.kind==='boss'?'boss':'', p.kind==='keystone'?'keystone':'', p.kind==='capstone'?'capstone':''].filter(Boolean).join(' ');
    const kindBadge = KIND_BADGE[p.kind] || '';
    const starsRow = p.state==='passed'
      ? `<span class="stars" aria-hidden="true">${starStr(p.stars,p.maxStars)}</span>`
      : (p.state==='locked' ? `<span class="meta">Locked</span>` : `<span class="meta">${p.state==='current'?'In progress':'Ready'}</span>`);
    html += `<li class="mrow">
      <button class="${cls}" data-state="${p.state}" ${p.state==='locked'?'aria-disabled="true"':''} aria-current="${p.state==='current'?'step':'false'}">
        <span class="sr-only">${srLabel}</span>
        <span class="idx" aria-hidden="true">${num}</span>
        <span class="ti" aria-hidden="true">${p.t} ${kindBadge}</span>
        ${starsRow}
      </button>
    </li>`;
    if (p.w === SEAM_AFTER_WORLD && p.kind==='boss'){
      html += `<li class="mseam">${SEAM_TEXT}</li>`;
    }
  });
  ol.innerHTML = html;
}

/* -------- afterboard note + theme toggle -------- */
document.getElementById('afterboard').textContent =
  'Thirty-one steps, bottom-left to the far corner. Each world is a band of the board; clear its boss to climb to the next band and promote your piece. The dashed rank-line after World 4 is the Workshop seam.';

const btn = document.getElementById('themeBtn');
btn.addEventListener('click', () => {
  const on = document.body.classList.toggle('light');
  btn.setAttribute('aria-pressed', String(on));
  btn.textContent = on ? 'Dark theme' : 'Light theme';
});

/* build everything */
const placed = layout();
renderSquares();
renderPieces(placed);
renderPathAndTiles(placed);
renderMobile();
</script>
</body>
</html>
